name: Integration FFmpeg validation
on:
  push:
    branches: [validation/filmcraft-oracles-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-tests:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libasound2-dev ffmpeg
      env: |
        FILMCRAFT_REQUIRE_ORACLES=1
      command: |
        # External fixture generator/oracle only; never linked or bundled with FilmCraft.
        oracle_dir="$RUNNER_TEMP/filmcraft-ffmpeg"
        mkdir -p "$oracle_dir"
        curl --fail --location --retry 3 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-30-13-01/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz' -o "$oracle_dir/ffmpeg.tar.xz"
        echo '0912d9de5837ae3fbeb98c54e5a5886ac7fcb68aee7d7d1cfcd2d20c505eccf2  '"$oracle_dir/ffmpeg.tar.xz" | sha256sum --check
        tar -xJf "$oracle_dir/ffmpeg.tar.xz" -C "$oracle_dir" --strip-components=1
        export PATH="$oracle_dir/bin:$PATH"
        ffmpeg -version
        ffprobe -version
        cargo nextest run --workspace --lib --bins --tests --no-fail-fast
