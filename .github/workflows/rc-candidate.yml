"name": "FilmCraft Windows RC candidate"
"on":
  "push":
    "branches":
      - "rc/20261024"
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
"concurrency":
  "group": "filmcraft-rc-${{ github.ref }}"
  "cancel-in-progress": true
"env":
  "CARGO_BUILD_JOBS": "2"
  "CARGO_INCREMENTAL": "0"
  "CARGO_PROFILE_DEV_DEBUG": "0"
  "CARGO_PROFILE_TEST_DEBUG": "0"
  "CARGO_PROFILE_RELEASE_DEBUG": "0"
  "RUST_TEST_THREADS": "1"
  "FILMCRAFT_REQUIRE_ORACLES": "1"
  "FILMCRAFT_BUILD_SHA": "${{ github.sha }}"
  "FILMCRAFT_BUILD_DATE": "2026-10-24"
"jobs":
  "windows":
    "name": "Windows x64 quality, MSI and portable ZIP"
    "runs-on": "windows-2022"
    "timeout-minutes": 240
    "env":
      "CRAFT_FONTS_DIR": "${{ github.workspace }}\\.rc-fonts"
    "defaults":
      "run":
        "shell": "pwsh"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "persist-credentials": false
          "fetch-depth": 0
      -
        "uses": "actions/checkout@v4"
        "with":
          "repository": "storytold/craft-fonts"
          "ref": "bfcbf714e45a3ea8e98f88ab2b7971372a576414"
          "path": ".rc-fonts"
          "persist-credentials": false
      -
        "uses": "dtolnay/rust-toolchain@stable"
        "with":
          "toolchain": "1.99.1"
          "components": "clippy,rustfmt"
      -
        "uses": "Swatinem/rust-cache@v2"
        "with":
          "shared-key": "rc-windows-x64-1.99.1"
          "cache-on-failure": true
          "save-if": true
      -
        "uses": "actions/setup-dotnet@v4"
        "with":
          "dotnet-version": "8.0.x"
      -
        "name": "Install external oracles and WiX"
        "run": |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ffmpeg -version
          ffprobe -version
      -
        "name": "Format, native Clippy, workspace tests and doctests"
        "run": |
          New-Item -ItemType Directory -Force logs | Out-Null
          cargo fmt --all -- --check 2>&1 | Tee-Object logs/fmt.log
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | Tee-Object logs/clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Native Clippy failed' }
          cargo test --workspace --lib --bins --tests --locked --no-fail-fast 2>&1 | Tee-Object logs/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          cargo test --workspace --doc --locked 2>&1 | Tee-Object logs/doctests.log
          if ($LASTEXITCODE -ne 0) { throw 'Doctests failed' }
      -
        "name": "Validate dependency layers and asset attribution"
        "run": |
          cargo run --locked -p xtask -- layers 2>&1 | Tee-Object logs/layers.log
          if ($LASTEXITCODE -ne 0) { throw 'Dependency layer check failed' }
          cargo run --locked -p xtask -- assets 2>&1 | Tee-Object logs/assets.log
          if ($LASTEXITCODE -ne 0) { throw 'Asset attribution check failed' }
      -
        "name": "Build and package the RC"
        "run": |
          & packaging/windows/package.ps1 -Arch x64 2>&1 | Tee-Object logs/packaging.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      -
        "name": "Record exact source, packages, checksums and acceptance kit"
        "run": "python validation/rc-20261024/record-build.py windows-x64"
        "if": "always()"
        "env":
          "RC_JOB_STATUS": "${{ job.status }}"
      -
        "uses": "actions/upload-artifact@v4"
        "if": "always()"
        "with":
          "name": "filmcraft-rc-windows-x64"
          "path": "rc-artifacts/"
          "if-no-files-found": "error"
          "retention-days": 30
