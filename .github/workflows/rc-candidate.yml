          "run": "cargo clippy --workspace --all-features --locked -- -D clippy::expect_used 2>&1 | Tee-Object qa-evidence/all-features-clippy.log\nif ($LASTEXITCODE -ne 0) { throw 'All-features lint failed' }",
          "if": "always()"
        },
        {
          "name": "H264 no-threads regression suite",
          "run": "cargo test --locked -p filmcraft-h264 --no-default-features 2>&1 | Tee-Object qa-evidence/h264-no-threads.log\nif ($LASTEXITCODE -ne 0) { throw 'No-threads tests failed' }",
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "rc-20261024-full-pr-supplement",
            "path": "qa-evidence/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}