{
  "name": "FilmCraft finite pitch source isolation",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CARGO_BUILD_JOBS": "2",
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_RELEASE_DEBUG": "0"
  },
  "jobs": {
    "pitch": {
      "runs-on": "windows-2022",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "label": "base",
              "sha": "bfc23840b603e69c782302c6ed04d4a9f6ec26a8"
            },
            {
              "label": "pre3146",
              "sha": "e423cb32eb8bc694deb323944fa74b4822a0b0f3"
            },
            {
              "label": "after3146",
              "sha": "0f7770342b1e8db2b75123a9d3e354bb055c6eab"
            },
            {
              "label": "after3148",
              "sha": "66bf499e0d19dc3d7cb9e298b84d495403614e2a"
            },
            {
              "label": "candidate",
              "sha": "ab77f2d8329550fb80a8bd9a20dec206f05b6958"
            }
          ]
        }
      },
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ matrix.sha }}",
            "path": "source",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "toolchain": "1.99.1"
          }
        },
        {
          "name": "Discover and run finite pitch public API harness",
          "env": {
            "QA_LABEL": "${{ matrix.label }}",
            "QA_SOURCE_SHA": "${{ matrix.sha }}"
          },
          "run": "[IO.File]::WriteAllBytes('qa-runner.py',[Convert]::FromBase64String(''))\npython -X utf8 qa-runner.py\nif ($LASTEXITCODE -ne 0) { throw 'Pitch harness failed' }"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "pitch-isolation-${{ matrix.label }}",
            "path": "qa-evidence/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "compare": {
      "needs": "pitch",
      "if": "always()",
      "runs-on": "windows-2022",
      "timeout-minutes": 10,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "pitch-isolation-*",
            "path": "combined",
            "merge-multiple": true
          }
        },
        {
          "name": "Compare source versions and channel isolation",
          "run": "[IO.File]::WriteAllBytes('qa-analysis.py',[Convert]::FromBase64String(''))\npython -X utf8 qa-analysis.py\nif ($LASTEXITCODE -ne 0) { throw 'Pitch parity isolation found a failure or coverage gap' }"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "pitch-isolation-analysis",
            "path": "analysis-evidence/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}