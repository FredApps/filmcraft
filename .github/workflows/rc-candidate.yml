{
  "name": "FilmCraft pinned Windows comparison base",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CARGO_BUILD_JOBS": "2",
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_RELEASE_DEBUG": "0",
    "FILMCRAFT_BUILD_SHA": "bfc23840b603e69c782302c6ed04d4a9f6ec26a8",
    "CRAFT_FONTS_DIR": "${{ github.workspace }}\\.rc-fonts"
  },
  "jobs": {
    "baseline": {
      "runs-on": "windows-2022",
      "timeout-minutes": 180,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "bfc23840b603e69c782302c6ed04d4a9f6ec26a8",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "storytold/craft-fonts",
            "ref": "bfcbf714e45a3ea8e98f88ab2b7971372a576414",
            "path": ".rc-fonts",
            "persist-credentials": false
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "toolchain": "1.99.1"
          }
        },
        {
          "uses": "Swatinem/rust-cache@v2",
          "with": {
            "shared-key": "rc-windows-x64-1.99.1",
            "cache-on-failure": true,
            "cache-workspace-crates": true
          }
        },
        {
          "uses": "actions/setup-dotnet@v4",
          "with": {
            "dotnet-version": "8.0.x"
          }
        },
        {
          "name": "Install pinned WiX",
          "run": "dotnet tool install --global wix --version 5.0.2\nif ($LASTEXITCODE -ne 0) { throw 'WiX install failed' }\n\"$env:USERPROFILE\\.dotnet\\tools\" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append"
        },
        {
          "name": "Build pinned comparison base",
          "run": "New-Item -ItemType Directory -Force baseline-artifacts | Out-Null\n$actual = git rev-parse HEAD\nif ($actual -ne 'bfc23840b603e69c782302c6ed04d4a9f6ec26a8') { throw 'Wrong base source' }\n$actual | Set-Content baseline-artifacts/source-commit.txt\nrustc -Vv | Set-Content baseline-artifacts/toolchain.txt\nGet-FileHash Cargo.lock -Algorithm SHA256 | Format-List | Out-File baseline-artifacts/lock-hash.txt\n& packaging/windows/package.ps1 -Arch x64 2>&1 | Tee-Object baseline-artifacts/packaging.log\nif ($LASTEXITCODE -ne 0) { throw 'Base packaging failed' }\nCopy-Item dist/release/* -Destination baseline-artifacts/\nGet-ChildItem baseline-artifacts -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name } | Set-Content baseline-artifacts/SHA256SUMS.txt"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "filmcraft-comparison-base-windows-x64",
            "path": "baseline-artifacts/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}