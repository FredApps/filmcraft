        {
          "name": "Install pinned WARP for hosted GPU tests",
          "run": "# wgpu CI also installs WARP beside test executables on windows-2022.\n# This runtime is for hosted tests only; release packages contain no WARP DLL.\nNew-Item -ItemType Directory -Force logs | Out-Null\n$warpArchive = Join-Path $env:RUNNER_TEMP 'warp-1.0.20.zip'\nInvoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.20/microsoft.direct3d.warp.1.0.20.nupkg' -OutFile $warpArchive\n$warpHash = 'e5fe5de661ce98b58ef9cfb736e73c0a7a2623d3bbf5f14839b2d55566d87e40'\nif ((Get-FileHash -LiteralPath $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $warpHash) { throw 'WARP archive checksum mismatch' }\n$warpRoot = Join-Path $env:RUNNER_TEMP 'warp-1.0.20'\nExpand-Archive -LiteralPath $warpArchive -DestinationPath $warpRoot\n$warpDll = Join-Path $warpRoot 'build/native/bin/x64/d3d10warp.dll'\nforeach ($destination in @('target/debug', 'target/debug/deps')) {\n  New-Item -ItemType Directory -Force $destination | Out-Null\n  Copy-Item -LiteralPath $warpDll -Destination $destination\n}\n\"$warpHash  microsoft.direct3d.warp.1.0.20.nupkg\" | Set-Content logs/warp-sha256.log\n(Get-Item -LiteralPath $warpDll).VersionInfo | Format-List FileVersion,ProductVersion | Out-File logs/warp-version.log"
        },
        {
          "name": "Install pinned external oracle",
          "run": "$ErrorActionPreference='Stop'\nNew-Item -ItemType Directory -Force logs | Out-Null\n$oracleArchive = Join-Path $env:RUNNER_TEMP 'ffmpeg-oracle.zip'\nInvoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-24-13-02/ffmpeg-N-128013-g6b05263b44-win64-gpl.zip' -OutFile $oracleArchive\n$expectedOracleHash = '5c31cb2f41de970ed9a49414c232b7eb83c1a2632ae5245225013335f8ff1fab'\nif ((Get-FileHash -LiteralPath $oracleArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedOracleHash) { throw 'Oracle archive checksum mismatch' }\n$oracleRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-oracle'\nExpand-Archive -LiteralPath $oracleArchive -DestinationPath $oracleRoot\n$oracleFfmpeg = (Get-ChildItem -LiteralPath $oracleRoot -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName\nif (-not $oracleFfmpeg) { throw 'Oracle ffmpeg missing' }\n$oracleBin = Split-Path -Parent $oracleFfmpeg\n$env:FILMCRAFT_FFMPEG = $oracleFfmpeg\n$env:FILMCRAFT_FFPROBE = Join-Path $oracleBin 'ffprobe.exe'\n\"FILMCRAFT_FFMPEG=$env:FILMCRAFT_FFMPEG\" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n\"FILMCRAFT_FFPROBE=$env:FILMCRAFT_FFPROBE\" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n$oracleBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append\n$encoderList = (& $oracleFfmpeg -hide_banner -encoders 2>&1 | Out-String)\nif ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate oracle encoders' }\n$encoderList | Set-Content logs/oracle-encoders.log\nforeach ($codec in @('libx264', 'libx265', 'libaom-av1', 'libsvtav1', 'libkvazaar')) {\n  if ($encoderList -notmatch \"(?m)^\\s*\\S+\\s+$([regex]::Escape($codec))\\s\") { throw \"Oracle lacks $codec\" }\n}\n$decoderList = (& $oracleFfmpeg -hide_banner -decoders 2>&1 | Out-String)\nif ($LASTEXITCODE -ne 0 -or $decoderList -notmatch '(?m)^\\s*\\S+\\s+libdav1d\\s') { throw 'Oracle lacks libdav1d' }\n$decoderList | Set-Content logs/oracle-decoders.log\n\"$expectedOracleHash  ffmpeg-oracle.zip\" | Set-Content logs/oracle-sha256.log\n"
        },
